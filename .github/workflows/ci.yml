name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: quintawise
          POSTGRES_USER: quintawise
          POSTGRES_PASSWORD: quintawise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quintawise -d quintawise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://quintawise:quintawise@localhost:5432/quintawise
      MIGRATIONS_DIR: infrastructure/sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: pip-audit -r apps/api/requirements-dev.txt
      - run: ruff check apps/api workers/ingestion
      - run: ruff format --check apps/api workers/ingestion
      - run: PYTHONPATH=apps/api python -m app.migrations
      - run: PYTHONPATH=apps/api python -m app.migrations
      - run: PYTHONPATH=apps/api pytest -q apps/api/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
